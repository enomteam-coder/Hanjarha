<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>قانون اساسی</title>
<meta name="description" content="متن کامل قانون اساسی جمهوری اسلامی ایران، شامل ۱۴ فصل و ۱۷۷ اصل، با قابلیت جستجو و مرور فصل به فصل.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

:root{
  --ink:#1B2F27;
  --ink-soft:#3A4E45;
  --paper:#F6F3EC;
  --paper-raised:#FFFFFF;
  --gold:#A9832F;
  --gold-soft:#D9BE84;
  --line:#E3DDCC;
  --green:#1F4A3A;
  --green-deep:#12241D;
  --shadow: 0 1px 2px rgba(27,47,39,.06), 0 8px 24px rgba(27,47,39,.08);
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Vazirmatn', sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
#app{
  max-width:560px;
  margin:0 auto;
  min-height:100vh;
  position:relative;
  background:var(--paper);
}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  background:linear-gradient(180deg, var(--green-deep), var(--green));
  color:#F3EFE1;
  padding:18px 20px 16px;
  border-bottom:3px solid var(--gold);
}
.topbar .row{display:flex; align-items:center; gap:12px;}
.back-btn{
  width:34px; height:34px; border-radius:50%;
  background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2);
  display:flex; align-items:center; justify-content:center;
  color:#F3EFE1; font-size:16px; flex-shrink:0;
  cursor:pointer;
}
.topbar h1{
  font-size:19px; font-weight:700; letter-spacing:.2px;
  flex:1;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.topbar .sub{
  font-size:12.5px; color:#C9BFA0; margin-top:4px; padding-right:46px;
}

.search-wrap{padding:14px 20px 0;}
.search-box{
  display:flex; align-items:center; gap:8px;
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:14px;
  padding:11px 14px;
  box-shadow:var(--shadow);
}
.search-box input{
  border:none; outline:none; background:transparent;
  font-family:'Vazirmatn', sans-serif;
  font-size:14.5px; color:var(--ink); flex:1;
}
.search-box input::placeholder{color:#9C9484;}
.search-icon{color:var(--gold); font-size:15px;}

/* ---------- Home: chapter list ---------- */
.view{padding:16px 20px 100px;}
.hero-line{
  display:flex; align-items:center; justify-content:space-between;
  margin:18px 2px 14px;
}
.hero-line .stat{font-size:12.5px; color:var(--ink-soft);}
.hero-line .stat b{color:var(--green); font-weight:700;}

.chapter-card{
  display:flex; align-items:center; gap:14px;
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px 16px;
  margin-bottom:10px;
  box-shadow:var(--shadow);
  cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease;
}
.chapter-card:active{transform:scale(.98);}

.seal{
  width:52px; height:52px; border-radius:50%;
  border:2px solid var(--gold);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; position:relative;
  background:
    radial-gradient(circle at 30% 30%, rgba(169,131,47,.08), transparent 60%),
    var(--paper);
}
.seal::before{
  content:'';
  position:absolute; inset:4px;
  border:1px dashed var(--gold-soft);
  border-radius:50%;
}
.seal span{
  font-size:16px; font-weight:800; color:var(--green);
  position:relative; z-index:1;
}

.chapter-info{flex:1; min-width:0;}
.chapter-info .cat{
  font-size:11px; color:var(--gold); font-weight:600; margin-bottom:3px;
}
.chapter-info .title{
  font-size:15.5px; font-weight:700; color:var(--ink); line-height:1.4;
}
.chapter-info .count{
  font-size:12px; color:var(--ink-soft); margin-top:4px;
}
.chevron{color:var(--gold-soft); font-size:18px; flex-shrink:0;}

/* ---------- Article list ---------- */
.article-row{
  display:flex; align-items:flex-start; gap:12px;
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px 15px;
  margin-bottom:8px;
  cursor:pointer;
}
.article-row:active{transform:scale(.98);}
.article-badge{
  width:36px; height:36px; border-radius:10px;
  background:var(--green); color:#F3EFE1;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:700; flex-shrink:0;
}
.article-preview{flex:1; min-width:0;}
.article-preview .a-title{font-size:13.5px; font-weight:600; color:var(--ink); margin-bottom:3px;}
.article-preview .a-snippet{
  font-size:12.5px; color:var(--ink-soft); line-height:1.6;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}

.section-label{
  font-size:13px; font-weight:700; color:var(--green);
  margin:18px 4px 10px; padding-right:12px; border-right:3px solid var(--gold);
}

/* ---------- Article detail ---------- */
.detail-card{
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:18px;
  padding:22px 20px;
  box-shadow:var(--shadow);
}
.detail-seal{
  display:flex; align-items:center; gap:12px; margin-bottom:18px;
  padding-bottom:16px; border-bottom:1px solid var(--line);
}
.detail-seal .seal{width:48px; height:48px;}
.detail-seal .seal span{font-size:14px;}
.detail-meta .m-chapter{font-size:11.5px; color:var(--gold); font-weight:600;}
.detail-meta .m-title{font-size:15px; font-weight:700; color:var(--ink); margin-top:2px;}

.detail-text{
  font-size:15.5px; line-height:2.15; color:var(--ink);
  text-align:justify;
}

.nav-buttons{
  display:flex; gap:10px; margin-top:18px;
}
.nav-btn{
  flex:1; padding:12px; border-radius:12px;
  background:var(--paper); border:1px solid var(--line);
  font-family:'Vazirmatn'; font-size:13px; font-weight:600; color:var(--green);
  text-align:center; cursor:pointer;
}
.nav-btn:active{background:var(--line);}
.nav-btn.disabled{opacity:.35; pointer-events:none;}

/* ---------- Search results ---------- */
.search-result{
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px 16px;
  margin-bottom:8px;
  cursor:pointer;
}
.search-result .sr-chapter{font-size:11px; color:var(--gold); font-weight:600; margin-bottom:4px;}
.search-result .sr-num{font-size:13.5px; font-weight:700; color:var(--ink); margin-bottom:5px;}
.search-result .sr-text{font-size:12.5px; color:var(--ink-soft); line-height:1.7;}
.search-result mark{background:var(--gold-soft); color:var(--ink); border-radius:3px; padding:0 2px;}

.empty-state{
  text-align:center; padding:60px 20px; color:var(--ink-soft);
}
.empty-state .e-icon{font-size:36px; margin-bottom:12px; opacity:.4;}
.empty-state .e-text{font-size:13.5px;}

.hidden{display:none !important;}

/* scrollbar cosmetic */
::-webkit-scrollbar{width:0px;}
</style>
</head>

        <h1 id="topTitle">قانون اساسی جمهوری اسلامی ایران</h1>
        <div class="sub" id="topSub">۱۴ فصل · ۱۷۷ اصل</div>
      </div>
    </div>
  </div>

  <div class="search-wrap">
    <div class="search-box">
      <span class="search-icon">⌕</span>
      <input id="searchInput" type="text" placeholder="جستجو در متن اصل‌ها..." oninput="onSearch(this.value)">
    </div>
  </div>

  <div class="view" id="homeView"></div>
  <div class="view hidden" id="chapterView"></div>

</div>

<script>
const DATA = {"title": "قانون اساسی جمهوری اسلامی ایران", "total_chapters": 14, "total_articles": 177, "chapters": [{"chapter_number": 1, "chapter_title": "اصول کلی", "category": "کلیات و مبانی نظام", "articles": [{"article_number": 1, "text": "حكومت ایران جمهوری اسلامی است که ملت ایران، بر اساس اعتقاد دیرینه‌اش به حكومت حق و عدل قرآن، در پی انقلاب اسلامی پیروزمند خود به رهبری مرجع عالی‌قدر تقلید حضرت آیت‌الله العظمی امام خمینی، در همه‌پرسی دهم و یازدهم فروردین‌ماه یك هزار و سیصد و پنجاه و هشت هجری شمسی برابر با اول و دوم جمادی الاولی سال یك هزار و سیصد و نود و نه هجری قمری با اکثریت ۹۸.۲٪ کلیه کسانی که حق رأی داشتند، به آن رأی مثبت داد."}, {"article_number": 2, "text": "جمهوری اسلامی، نظامی است بر پایه ایمان به: ۱- خدای یكتا (لا اله الا الله) و اختصاص حاکمیت و تشریع به او و لزوم تسلیم در برابر امر او؛ ۲- وحی الهی و نقش بنیادی آن در بیان قوانین؛ ۳- معاد و نقش سازنده آن در سیر تكاملی انسان به سوی خدا؛ ۴- عدل خدا در خلقت و تشریع؛ ۵- امامت و رهبری مستمر و نقش اساسی آن در تداوم انقلاب اسلام؛ ۶- کرامت و ارزش والای انسان و آزادی توأم با مسئولیت او در برابر خدا، که از راه: الف- اجتهاد مستمر فقهای جامع الشرایط بر اساس کتاب و سنت معصومین؛ ب- استفاده از علوم و فنون و تجارب پیشرفته بشری و تلاش در پیشبرد آنها؛ ج- نفی هرگونه ستمگری و ستم‌کشی و سلطه‌گری و سلطه‌پذیری، قسط و عدل و استقلال سیاسی و اقتصادی و اجتماعی و فرهنگی و همبستگی ملی را تأمین می‌کند."}, {"article_number": 3, "text": "دولت جمهوری اسلامی ایران موظف است برای نیل به اهداف مذکور در اصل دوم، همه امكانات خود را برای امور زیر به کار برد: ۱- ایجاد محیط مساعد برای رشد فضایل اخلاقی؛ ۲- بالابردن سطح آگاهی‌های عمومی؛ ۳- آموزش و پرورش و تربیت بدنی رایگان برای همه؛ ۴- تقویت روح بررسی و تتبع و ابتكار در تمام زمینه‌های علمی، فنی، فرهنگی و اسلامی؛ ۵- طرد کامل استعمار و جلوگیری از نفوذ اجانب؛ ۶- محو هرگونه استبداد و خودکامگی و انحصارطلبی؛ ۷- تأمین آزادی‌های سیاسی و اجتماعی در حدود قانون؛ ۸- مشارکت عامه مردم در تعیین سرنوشت خویش؛ ۹- رفع تبعیضات ناروا؛ ۱۰- ایجاد نظام اداری صحیح؛ ۱۱- تقویت کامل بنیه دفاع ملی؛ ۱۲- پی‌ریزی اقتصاد صحیح و عادلانه؛ ۱۳- تأمین خودکفایی در علوم و فنون و صنعت و کشاورزی؛ ۱۴- تأمین حقوق همه‌جانبه افراد از زن و مرد؛ ۱۵- توسعه و تحكیم برادری اسلامی؛ ۱۶- تنظیم سیاست خارجی کشور بر اساس معیارهای اسلام."}, {"article_number": 4, "text": "کلیه قوانین و مقررات مدنی، جزایی، مالی، اقتصادی، اداری، فرهنگی، نظامی، سیاسی و غیر اینها باید بر اساس موازین اسلامی باشد. این اصل بر اطلاق یا عموم همه اصول قانون اساسی و قوانین و مقررات دیگر حاکم است و تشخیص این امر بر عهده فقهای شورای نگهبان است."}, {"article_number": 5, "text": "در زمان غیبت حضرت ولی عصر (عجل الله تعالی فرجه)، در جمهوری اسلامی ایران ولایت امر و امامت امت بر عهده فقیه عادل و با تقوی، آگاه به زمان، شجاع، مدیر و مدبر است که طبق اصل یكصد و هفتم عهده‌دار آن می‌گردد."}, {"article_number": 6, "text": "در جمهوری اسلامی ایران، امور کشور باید به اتكاء آراء عمومی اداره شود، از راه انتخابات: انتخاب رئیس جمهور، نمایندگان مجلس شورای اسلامی، اعضای شوراها و نظایر اینها، یا از راه همه‌پرسی در مواردی که در اصول دیگر این قانون معین می‌گردد."}, {"article_number": 7, "text": "طبق دستور قرآن کریم، شوراها: مجلس شورای اسلامی، شورای استان، شهرستان، شهر، محل، بخش، روستا و نظایر اینها از ارکان تصمیم‌گیری و اداره امور کشورند. موارد، طرز تشكیل و حدود اختیارات و وظایف شوراها را این قانون و قوانین ناشی از آن معین می‌کند."}, {"article_number": 8, "text": "در جمهوری اسلامی ایران دعوت به خیر، امر به معروف و نهی از منكر وظیفه‌ای است همگانی و متقابل بر عهده مردم نسبت به یكدیگر، دولت نسبت به مردم و مردم نسبت به دولت. شرایط و حدود و کیفیت آن را قانون معین می‌کند."}, {"article_number": 9, "text": "در جمهوری اسلامی ایران، آزادی و استقلال و وحدت و تمامیت ارضی کشور از یكدیگر تفكیك‌ناپذیرند و حفظ آنها وظیفه دولت و آحاد ملت است. هیچ فرد یا گروه یا مقامی حق ندارد به نام استفاده از آزادی، به استقلال سیاسی، فرهنگی، اقتصادی، نظامی و تمامیت ارضی ایران کمترین خدشه‌ای وارد کند."}, {"article_number": 10, "text": "از آنجا که خانواده واحد بنیادی جامعه اسلامی است، همه قوانین و مقررات و برنامه‌ریزی‌های مربوط باید در جهت آسان کردن تشكیل خانواده، پاسداری از قداست آن و استواری روابط خانوادگی بر پایه حقوق و اخلاق اسلامی باشد."}, {"article_number": 11, "text": "به حكم آیه کریمه، همه مسلمانان یك اُمتند و دولت جمهوری اسلامی ایران موظف است سیاست کلی خود را بر پایه ائتلاف و اتحاد ملل اسلامی قرار دهد و کوشش پیگیر به عمل آورد تا وحدت سیاسی، اقتصادی و فرهنگی جهان اسلام را تحقق بخشد."}, {"article_number": 12, "text": "دین رسمی ایران، اسلام و مذهب جعفری اثنی‌عشری است و این اصل الی الابد غیرقابل تغییر است و مذاهب دیگر اسلامی اعم از حنفی، شافعی، مالكی، حنبلی و زیدی دارای احترام کامل می‌باشند و پیروان این مذاهب در انجام مراسم مذهبی، طبق فقه خودشان آزادند."}, {"article_number": 13, "text": "ایرانیان زرتشتی، کلیمی و مسیحی تنها اقلیت‌های دینی شناخته می‌شوند که در حدود قانون در انجام مراسم دینی خود آزادند و در احوال شخصیه و تعلیمات دینی بر طبق آیین خود عمل می‌کنند."}, {"article_number": 14, "text": "به حكم آیه شریفه، دولت جمهوری اسلامی ایران و مسلمانان موظفند نسبت به افراد غیرمسلمان با اخلاق حسنه و قسط و عدل اسلامی عمل نمایند و حقوق انسانی آنان را رعایت کنند. این اصل در حق کسانی اعتبار دارد که بر ضد اسلام و جمهوری اسلامی ایران توطئه و اقدام نكنند."}]}, {"chapter_number": 2, "chapter_title": "زبان، خط، تاریخ و پرچم کشور", "category": "نمادهای ملی", "articles": [{"article_number": 15, "text": "زبان و خط رسمی و مشترك مردم ایران، فارسی است. اسناد و مكاتبات و متون رسمی و کتب درسی باید با این زبان و خط باشد، ولی استفاده از زبان‌های محلی و قومی در مطبوعات و رسانه‌های گروهی و تدریس ادبیات آنها در مدارس، در کنار زبان فارسی آزاد است."}, {"article_number": 16, "text": "از آنجا که زبان قرآن و علوم و معارف اسلامی، عربی است و ادبیات فارسی کاملاً با آن آمیخته است، این زبان باید پس از دوره ابتدایی تا پایان دوره متوسطه در همه کلاس‌ها و در همه رشته‌ها تدریس شود."}, {"article_number": 17, "text": "مبدأ تاریخ رسمی کشور، هجرت پیامبر اسلام (ص) است و تاریخ هجری شمسی و هجری قمری هر دو معتبر است، اما مبنای کار ادارات دولتی هجری شمسی است. تعطیل رسمی هفتگی روز جمعه است."}, {"article_number": 18, "text": "پرچم رسمی ایران به رنگ‌های سبز و سفید و سرخ، با علامت مخصوص جمهوری اسلامی و شعار «الله اکبر» است."}]}, {"chapter_number": 3, "chapter_title": "حقوق ملت", "category": "حقوق شهروندی و آزادی‌ها", "articles": [{"article_number": 19, "text": "مردم ایران از هر قوم و قبیله که باشند از حقوق مساوی برخوردارند و رنگ، نژاد، زبان و مانند اینها سبب امتیاز نخواهد بود."}, {"article_number": 20, "text": "همه افراد ملت اعم از زن و مرد، یكسان در حمایت قانون قرار دارند و از همه حقوق انسانی، سیاسی، اقتصادی، اجتماعی و فرهنگی با رعایت موازین اسلام برخوردارند."}, {"article_number": 21, "text": "دولت موظف است حقوق زن را در تمام جهات با رعایت موازین اسلامی تضمین نماید و امور زیر را انجام دهد: ۱- ایجاد زمینه‌های مساعد برای رشد شخصیت زن؛ ۲- حمایت مادران بالخصوص در دوران بارداری؛ ۳- ایجاد دادگاه صالح برای حفظ کیان خانواده؛ ۴- ایجاد بیمه خاص بیوگان و زنان سالخورده؛ ۵- اعطای قیمومت فرزندان به مادران شایسته در صورت نبودن ولی شرعی."}, {"article_number": 22, "text": "حیثیت، جان، مال، حقوق، مسكن و شغل اشخاص از تعرض مصون است، مگر در مواردی که قانون تجویز کند."}, {"article_number": 23, "text": "تفتیش عقاید ممنوع است و هیچ‌کس را نمی‌توان به صرف داشتن عقیده‌ای مورد تعرض و مؤاخذه قرار داد."}, {"article_number": 24, "text": "نشریات و مطبوعات در بیان مطالب آزادند، مگر آنكه مخل به مبانی اسلام یا حقوق عمومی باشد. تفصیل آن را قانون معین می‌کند."}, {"article_number": 25, "text": "بازرسی و نرساندن نامه‌ها، ضبط و فاش کردن مكالمات تلفنی، افشای مخابرات تلگرافی و تلكس، سانسور، عدم مخابره و نرساندن آنها، استراق سمع و هرگونه تجسس ممنوع است، مگر به حكم قانون."}, {"article_number": 26, "text": "احزاب، جمعیت‌ها، انجمن‌های سیاسی و صنفی و انجمن‌های اسلامی یا اقلیت‌های دینی شناخته‌شده آزادند، مشروط به اینكه اصول استقلال، آزادی، وحدت ملی، موازین اسلامی و اساس جمهوری اسلامی را نقض نكنند."}, {"article_number": 27, "text": "تشكیل اجتماعات و راه‌پیمایی‌ها، بدون حمل سلاح، به شرط آنكه مخل به مبانی اسلام نباشد آزاد است."}, {"article_number": 28, "text": "هر کس حق دارد شغلی را که بدان مایل است و مخالف اسلام و مصالح عمومی و حقوق دیگران نیست برگزیند. دولت موظف است با رعایت نیاز جامعه به مشاغل گوناگون، برای همه افراد امكان اشتغال به کار و شرایط مساوی را برای احراز مشاغل ایجاد نماید."}, {"article_number": 29, "text": "برخورداری از تأمین اجتماعی از نظر بازنشستگی، بیكاری، پیری، از کارافتادگی، بی‌سرپرستی، در راه‌ماندگی، حوادث و سوانح، نیاز به خدمات بهداشتی و درمانی، حقی است همگانی. دولت مكلف است طبق قوانین این خدمات را تأمین کند."}, {"article_number": 30, "text": "دولت موظف است وسایل آموزش و پرورش رایگان را برای همه ملت، تا پایان دوره متوسطه فراهم سازد و وسایل تحصیلات عالی را تا سر حد خودکفایی کشور به طور رایگان گسترش دهد."}, {"article_number": 31, "text": "داشتن مسكن متناسب با نیاز، حق هر فرد و خانواده ایرانی است. دولت موظف است با رعایت اولویت برای آنها که نیازمندترند به خصوص روستانشینان و کارگران، زمینه اجرای این اصل را فراهم کند."}, {"article_number": 32, "text": "هیچ‌کس را نمی‌توان دستگیر کرد مگر به حكم و ترتیبی که قانون معین می‌کند. در صورت بازداشت، موضوع اتهام باید بلافاصله کتباً به متهم ابلاغ شود و حداکثر ظرف مدت بیست و چهار ساعت پرونده مقدماتی به مراجع صالحه قضایی ارسال گردد."}, {"article_number": 33, "text": "هیچ‌کس را نمی‌توان از محل اقامت خود تبعید کرد یا از اقامت در محل مورد علاقه‌اش ممنوع یا به اقامت در محلی مجبور ساخت، مگر در مواردی که قانون مقرر می‌دارد."}, {"article_number": 34, "text": "دادخواهی حق مسلّم هر فرد است و هر کس می‌تواند به منظور دادخواهی به دادگاه‌های صالح رجوع نماید. همه افراد ملت حق دارند این‌گونه دادگاه‌ها را در دسترس داشته باشند."}, {"article_number": 35, "text": "در همه دادگاه‌ها طرفین دعوی حق دارند برای خود وکیل انتخاب نمایند و اگر توانایی انتخاب وکیل را نداشته باشند باید برای آنها امكانات تعیین وکیل فراهم گردد."}, {"article_number": 36, "text": "حكم به مجازات و اجرای آن باید تنها از طریق دادگاه صالح و به موجب قانون باشد."}, {"article_number": 37, "text": "اصل، برائت است و هیچ‌کس از نظر قانون مجرم شناخته نمی‌شود، مگر اینكه جرم او در دادگاه صالح ثابت گردد."}, {"article_number": 38, "text": "هرگونه شكنجه برای گرفتن اقرار و یا کسب اطلاع ممنوع است. اجبار شخص به شهادت، اقرار یا سوگند، مجاز نیست و چنین شهادت و اقرار و سوگندی فاقد ارزش و اعتبار است."}, {"article_number": 39, "text": "هتك حرمت و حیثیت کسی که به حكم قانون دستگیر، بازداشت، زندانی یا تبعید شده، به هر صورت که باشد ممنوع و موجب مجازات است."}, {"article_number": 40, "text": "هیچ‌کس نمی‌تواند اِعمال حق خویش را وسیله اضرار به غیر یا تجاوز به منافع عمومی قرار دهد."}, {"article_number": 41, "text": "تابعیت کشور ایران حق مسلّم هر فرد ایرانی است و دولت نمی‌تواند از هیچ ایرانی سلب تابعیت کند، مگر به درخواست خود او یا در صورتی که به تابعیت کشور دیگری درآید."}, {"article_number": 42, "text": "اتباع خارجه می‌توانند در حدود قوانین به تابعیت ایران درآیند و سلب تابعیت این‌گونه اشخاص در صورتی ممكن است که دولت دیگری تابعیت آنها را بپذیرد یا خود آنها درخواست کنند."}]}, {"chapter_number": 4, "chapter_title": "اقتصاد و امور مالی", "category": "اقتصاد و مالیه عمومی", "articles": [{"article_number": 43, "text": "برای تأمین استقلال اقتصادی جامعه، اقتصاد جمهوری اسلامی ایران بر اساس ضوابط زیر استوار می‌شود: ۱- تأمین نیازهای اساسی (مسكن، خوراك، پوشاك، بهداشت، درمان، آموزش)؛ ۲- تأمین شرایط اشتغال کامل؛ ۳- تنظیم برنامه اقتصادی برای فرصت خودسازی معنوی؛ ۴- رعایت آزادی انتخاب شغل؛ ۵- منع اضرار به غیر و انحصار و احتكار و ربا؛ ۶- منع اسراف و تبذیر؛ ۷- استفاده از علوم و فنون؛ ۸- جلوگیری از سلطه اقتصادی بیگانه؛ ۹- تأکید بر افزایش تولیدات کشاورزی و صنعتی."}, {"article_number": 44, "text": "نظام اقتصادی جمهوری اسلامی ایران بر پایه سه بخش دولتی، تعاونی و خصوصی با برنامه‌ریزی منظم استوار است. بخش دولتی شامل صنایع بزرگ، بازرگانی خارجی، معادن بزرگ، بانكداری، بیمه و مانند اینهاست. بخش تعاونی شامل شرکت‌ها و مؤسسات تعاونی تولید و توزیع است. بخش خصوصی شامل کشاورزی، دامداری، صنعت، تجارت و خدمات مكمل است."}, {"article_number": 45, "text": "انفال و ثروت‌های عمومی از قبیل زمین‌های موات، معادن، دریاها، رودخانه‌ها، کوه‌ها، جنگل‌ها، ارث بدون وارث و اموال مجهول‌المالك در اختیار حكومت اسلامی است تا بر طبق مصالح عامه نسبت به آنها عمل نماید."}, {"article_number": 46, "text": "هر کس مالك حاصل کسب و کار مشروع خویش است و هیچ‌کس نمی‌تواند به عنوان مالكیت نسبت به کسب و کار خود، امكان کسب و کار را از دیگری سلب کند."}, {"article_number": 47, "text": "مالكیت شخصی که از راه مشروع باشد محترم است. ضوابط آن را قانون معین می‌کند."}, {"article_number": 48, "text": "در بهره‌برداری از منابع طبیعی و استفاده از درآمدهای ملی در سطح استان‌ها، باید تبعیض در کار نباشد به طوری که هر منطقه فراخور نیازها و استعداد رشد خود، سرمایه و امكانات لازم در دسترس داشته باشد."}, {"article_number": 49, "text": "دولت موظف است ثروت‌های ناشی از ربا، غصب، رشوه، اختلاس، سرقت، قمار و سایر موارد غیرمشروع را گرفته و به صاحب حق رد کند و در صورت معلوم نبودن او به بیت‌المال بدهد."}, {"article_number": 50, "text": "در جمهوری اسلامی، حفاظت محیط زیست وظیفه عمومی تلقی می‌گردد. فعالیت‌های اقتصادی که با آلودگی محیط زیست یا تخریب غیرقابل جبران آن ملازمه پیدا کند، ممنوع است."}, {"article_number": 51, "text": "هیچ نوع مالیات وضع نمی‌شود مگر به موجب قانون. موارد معافیت و بخشودگی و تخفیف مالیاتی به موجب قانون مشخص می‌شود."}, {"article_number": 52, "text": "بودجه سالانه کل کشور از طرف دولت تهیه و برای رسیدگی و تصویب به مجلس شورای اسلامی تسلیم می‌گردد. هرگونه تغییر در ارقام بودجه نیز تابع مراتب مقرر در قانون خواهد بود."}, {"article_number": 53, "text": "کلیه دریافت‌های دولت در حساب‌های خزانه‌داری کل متمرکز می‌شود و همه پرداخت‌ها در حدود اعتبارات مصوب به موجب قانون انجام می‌گیرد."}, {"article_number": 54, "text": "دیوان محاسبات کشور مستقیماً زیر نظر مجلس شورای اسلامی می‌باشد. سازمان و اداره امور آن در تهران و مراکز استان‌ها به موجب قانون تعیین خواهد شد."}, {"article_number": 55, "text": "دیوان محاسبات به کلیه حساب‌های وزارتخانه‌ها، مؤسسات، شرکت‌های دولتی رسیدگی یا حسابرسی می‌نماید. گزارش تفریغ بودجه هر سال باید در دسترس عموم گذاشته شود."}]}, {"chapter_number": 5, "chapter_title": "حق حاکمیت ملت و قوای ناشی از آن", "category": "حاکمیت و تفكیك قوا", "articles": [{"article_number": 56, "text": "حاکمیت مطلق بر جهان و انسان از آن خداست و هم او، انسان را بر سرنوشت اجتماعی خویش حاکم ساخته است. ملت این حق خداداد را از طرقی که در اصول بعد می‌آید اِعمال می‌کند."}, {"article_number": 57, "text": "قوای حاکم در جمهوری اسلامی ایران عبارتند از: قوه مقننه، قوه مجریه و قوه قضائیه که زیر نظر ولایت مطلقه امر و امامت امت اعمال می‌گردند. این قوا مستقل از یكدیگرند."}, {"article_number": 58, "text": "اعمال قوه مقننه از طریق مجلس شورای اسلامی است که از نمایندگان منتخب مردم تشكیل می‌شود و مصوبات آن پس از طی مراحلی برای اجرا به قوه مجریه و قضائیه ابلاغ می‌گردد."}, {"article_number": 59, "text": "در مسائل بسیار مهم اقتصادی، سیاسی، اجتماعی و فرهنگی ممكن است اعمال قوه مقننه از راه همه‌پرسی صورت گیرد. درخواست مراجعه به آراء عمومی باید به تصویب دو سوم مجموع نمایندگان مجلس برسد."}, {"article_number": 60, "text": "اعمال قوه مجریه جز در اموری که مستقیماً بر عهده رهبری گذارده شده، از طریق رئیس جمهور و وزرا است."}, {"article_number": 61, "text": "اِعمال قوه قضائیه به وسیله دادگاه‌های دادگستری است که باید طبق موازین اسلامی تشكیل شود و به حل و فصل دعاوی و حفظ حقوق عمومی و گسترش و اجرای عدالت بپردازد."}]}, {"chapter_number": 6, "chapter_title": "قوه مقننه", "category": "قوه مقننه (مجلس)", "sections": [{"section_title": "مبحث اول- مجلس شورای اسلامی", "articles": [{"article_number": 62, "text": "مجلس شورای اسلامی از نمایندگان ملت که به طور مستقیم و با رأی مخفی انتخاب می‌شوند تشكیل می‌گردد. شرایط انتخاب‌کنندگان و انتخاب‌شوندگان و کیفیت انتخابات را قانون معین خواهد کرد."}, {"article_number": 63, "text": "دوره نمایندگی مجلس شورای اسلامی چهار سال است. انتخابات هر دوره باید پیش از پایان دوره قبل برگزار شود به طوری که کشور در هیچ زمان بدون مجلس نباشد."}, {"article_number": 64, "text": "عده نمایندگان مجلس شورای اسلامی دویست و هفتاد نفر است و پس از هر ده سال حداکثر بیست نفر نماینده می‌تواند اضافه شود. زرتشتیان و کلیمیان هرکدام یك نماینده و مسیحیان آشوری و کلدانی مجموعاً یك نماینده و مسیحیان ارمنی جنوب و شمال هرکدام یك نماینده انتخاب می‌کنند."}, {"article_number": 65, "text": "پس از برگزاری انتخابات، جلسات مجلس شورای اسلامی با حضور دو سوم مجموع نمایندگان رسمیت می‌یابد و تصویب طرح‌ها و لوایح طبق آیین‌نامه مصوب داخلی انجام می‌گیرد."}, {"article_number": 66, "text": "ترتیب انتخاب رئیس و هیئت رئیسه مجلس و تعداد کمیسیون‌ها و دوره تصدی آنها و امور مربوط به مذاکرات و انتظامات مجلس به‌وسیله آیین‌نامه داخلی مجلس معین می‌گردد."}, {"article_number": 67, "text": "نمایندگان باید در نخستین جلسه مجلس سوگند یاد کنند که پاسدار حریم اسلام و نگاهبان دستاوردهای انقلاب اسلامی و مبانی جمهوری اسلامی باشند و امانت و تقوا را رعایت نمایند و از قانون اساسی دفاع کنند."}, {"article_number": 68, "text": "در زمان جنگ و اشغال نظامی کشور به پیشنهاد رئیس جمهور و تصویب سه چهارم مجموع نمایندگان و تأیید شورای نگهبان انتخابات نقاط اشغال‌شده یا تمامی مملكت برای مدت معینی متوقف می‌شود."}, {"article_number": 69, "text": "مذاکرات مجلس شورای اسلامی باید علنی باشد و گزارش کامل آن از طریق رادیو و روزنامه رسمی برای اطلاع عموم منتشر شود. در شرایط اضطراری جلسه غیرعلنی می‌تواند تشكیل شود."}, {"article_number": 70, "text": "رئیس جمهور و معاونان او و وزیران به اجتماع یا به انفراد حق شرکت در جلسات علنی مجلس را دارند و در صورتی که نمایندگان لازم بدانند، وزرا مكلف به حضورند."}]}, {"section_title": "مبحث دوم- اختیارات و صلاحیت مجلس شورای اسلامی", "articles": [{"article_number": 71, "text": "مجلس شورای اسلامی در عموم مسائل در حدود مقرر در قانون اساسی می‌تواند قانون وضع کند."}, {"article_number": 72, "text": "مجلس شورای اسلامی نمی‌تواند قوانینی وضع کند که با اصول و احكام مذهب رسمی کشور یا قانون اساسی مغایرت داشته باشد. تشخیص این امر بر عهده شورای نگهبان است."}, {"article_number": 73, "text": "شرح و تفسیر قوانین عادی در صلاحیت مجلس شورای اسلامی است."}, {"article_number": 74, "text": "لوایح قانونی پس از تصویب هیئت وزیران به مجلس تقدیم می‌شود و طرح‌های قانونی به پیشنهاد حداقل پانزده نفر از نمایندگان، در مجلس شورای اسلامی قابل طرح است."}, {"article_number": 75, "text": "طرح‌های قانونی و پیشنهادها و اصلاحاتی که نمایندگان در خصوص لوایح قانونی عنوان می‌کنند و به تقلیل درآمد عمومی یا افزایش هزینه عمومی می‌انجامد، در صورتی قابل طرح در مجلس است که طریق جبران آن نیز معلوم شده باشد."}, {"article_number": 76, "text": "مجلس شورای اسلامی حق تحقیق و تفحص در تمام امور کشور را دارد."}, {"article_number": 77, "text": "عهدنامه‌ها، مقاوله‌نامه‌ها، قراردادها و موافقت‌نامه‌های بین‌المللی باید به تصویب مجلس شورای اسلامی برسد."}, {"article_number": 78, "text": "هرگونه تغییر در خطوط مرزی ممنوع است مگر اصلاحات جزئی با رعایت مصالح کشور، به شرط اینكه یك‌طرفه نباشد و به تصویب چهارپنجم مجموع نمایندگان مجلس برسد."}, {"article_number": 79, "text": "برقراری حكومت نظامی ممنوع است. در حالت جنگ و شرایط اضطراری، دولت حق دارد با تصویب مجلس محدودیت‌های ضروری را حداکثر برای سی روز برقرار نماید."}, {"article_number": 80, "text": "گرفتن و دادن وام یا کمك‌های بدون عوض داخلی و خارجی از طرف دولت باید با تصویب مجلس شورای اسلامی باشد."}, {"article_number": 81, "text": "دادن امتیاز تشكیل شرکت‌ها و مؤسسات در امور تجارتی و صنعتی و کشاورزی و معادن و خدمات به خارجیان مطلقاً ممنوع است."}, {"article_number": 82, "text": "استخدام کارشناسان خارجی از طرف دولت ممنوع است، مگر در موارد ضرورت با تصویب مجلس شورای اسلامی."}, {"article_number": 83, "text": "بناها و اموال دولتی که از نفایس ملی باشد قابل انتقال به غیر نیست مگر با تصویب مجلس شورای اسلامی."}, {"article_number": 84, "text": "هر نماینده در برابر تمام ملت مسئول است و حق دارد در همه مسائل داخلی و خارجی کشور اظهار نظر نماید."}, {"article_number": 85, "text": "سِمَت نمایندگی قائم به شخص است و قابل واگذاری به دیگری نیست. مجلس نمی‌تواند اختیار قانون‌گذاری را به شخص یا هیئتی واگذار کند ولی در موارد ضروری می‌تواند اختیار وضع بعضی از قوانین را به کمیسیون‌های داخلی خود تفویض کند."}, {"article_number": 86, "text": "نمایندگان مجلس در مقام ایفای وظایف نمایندگی در اظهار نظر و رأی خود کاملاً آزادند و نمی‌توان آنها را به سبب نظراتی که در مجلس اظهار کرده‌اند تعقیب یا توقیف کرد."}, {"article_number": 87, "text": "رئیس جمهور برای هیئت وزیران پس از تشكیل و پیش از هر اقدام دیگر باید از مجلس رأی اعتماد بگیرد."}, {"article_number": 88, "text": "در هر مورد که حداقل یك چهارم کل نمایندگان مجلس از رئیس جمهور و یا هر یك از نمایندگان از وزیر مسئول سؤال کنند، رئیس جمهور یا وزیر موظف است در مجلس حاضر شود و پاسخ دهد."}, {"article_number": 89, "text": "۱- نمایندگان می‌توانند هیئت وزیران یا هر یك از وزرا را استیضاح کنند. اگر مجلس رأی اعتماد نداد وزیر مورد استیضاح عزل می‌شود. ۲- در صورتی که حداقل یك سوم از نمایندگان رئیس جمهور را استیضاح کنند و اکثریت دو سوم به عدم کفایت وی رأی دهند، مراتب به اطلاع مقام رهبری می‌رسد."}, {"article_number": 90, "text": "هر کس شكایتی از طرز کار مجلس یا قوه مجریه یا قوه قضائیه داشته باشد، می‌تواند شكایت خود را کتباً به مجلس شورای اسلامی عرضه کند."}, {"article_number": 91, "text": "به منظور پاسداری از احكام اسلام و قانون اساسی، شورایی به نام شورای نگهبان تشكیل می‌شود: ۱- شش نفر از فقهای عادل با انتخاب مقام رهبری؛ ۲- شش نفر حقوقدان که به وسیله رئیس قوه قضائیه معرفی و با رأی مجلس انتخاب می‌گردند."}, {"article_number": 92, "text": "اعضای شورای نگهبان برای مدت شش سال انتخاب می‌شوند ولی در نخستین دوره پس از سه سال، نیمی از اعضای هر گروه به قید قرعه تغییر می‌یابند."}, {"article_number": 93, "text": "مجلس شورای اسلامی بدون وجود شورای نگهبان اعتبار قانونی ندارد مگر در مورد تصویب اعتبارنامه نمایندگان و انتخاب حقوقدانان شورای نگهبان."}, {"article_number": 94, "text": "کلیه مصوبات مجلس باید به شورای نگهبان فرستاده شود. شورای نگهبان موظف است حداکثر ظرف ده روز از نظر انطباق بر موازین اسلام و قانون اساسی بررسی کند."}, {"article_number": 95, "text": "در مواردی که شورای نگهبان مدت ده روز را کافی نداند، می‌تواند حداکثر برای ده روز دیگر خواستار تمدید وقت شود."}, {"article_number": 96, "text": "تشخیص عدم مغایرت مصوبات مجلس با احكام اسلام با اکثریت فقهای شورای نگهبان و تشخیص عدم تعارض با قانون اساسی بر عهده اکثریت همه اعضای شورای نگهبان است."}, {"article_number": 97, "text": "اعضای شورای نگهبان می‌توانند هنگام مذاکره درباره لایحه یا طرح قانونی در مجلس حاضر شوند و مذاکرات را استماع کنند."}, {"article_number": 98, "text": "تفسیر قانون اساسی به عهده شورای نگهبان است که با تصویب سه چهارم آنان انجام می‌شود."}, {"article_number": 99, "text": "شورای نگهبان نظارت بر انتخابات مجلس خبرگان رهبری، ریاست جمهوری، مجلس شورای اسلامی و مراجعه به آراء عمومی و همه‌پرسی را بر عهده دارد."}]}]}, {"chapter_number": 7, "chapter_title": "شوراها", "category": "شوراهای محلی", "articles": [{"article_number": 100, "text": "برای پیشبرد سریع برنامه‌های اجتماعی، اقتصادی، عمرانی، بهداشتی، فرهنگی، آموزشی و سایر امور رفاهی، اداره امور هر روستا، بخش، شهر، شهرستان یا استان با نظارت شورایی صورت می‌گیرد که اعضای آن را مردم همان محل انتخاب می‌کنند."}, {"article_number": 101, "text": "به منظور جلوگیری از تبعیض و جلب همكاری در تهیه برنامه‌های عمرانی و رفاهی استان‌ها، شورای عالی استان‌ها مرکب از نمایندگان شوراهای استان‌ها تشكیل می‌شود."}, {"article_number": 102, "text": "شورای عالی استان‌ها حق دارد در حدود وظایف خود طرح‌هایی تهیه و مستقیماً یا از طریق دولت به مجلس شورای اسلامی پیشنهاد کند."}, {"article_number": 103, "text": "استانداران، فرمانداران، بخشداران و سایر مقامات کشوری که از طرف دولت تعیین می‌شوند، در حدود اختیارات شوراها ملزم به رعایت تصمیمات آنها هستند."}, {"article_number": 104, "text": "به منظور تأمین قسط اسلامی و همكاری در تهیه برنامه‌ها، شوراهایی مرکب از نمایندگان کارگران و دهقانان و دیگر کارکنان و مدیران، و در واحدهای آموزشی و اداری شوراهایی مرکب از نمایندگان اعضای این واحدها تشكیل می‌شود."}, {"article_number": 105, "text": "تصمیمات شوراها نباید مخالف موازین اسلام و قوانین کشور باشد."}, {"article_number": 106, "text": "انحلال شوراها جز در صورت انحراف از وظایف قانونی ممكن نیست. شورا در صورت اعتراض به انحلال حق دارد به دادگاه صالح شكایت کند."}]}, {"chapter_number": 8, "chapter_title": "رهبر یا شورای رهبری", "category": "رهبری و ولایت فقیه", "articles": [{"article_number": 107, "text": "پس از مرجع عالی‌قدر تقلید و رهبر کبیر انقلاب امام خمینی، تعیین رهبر به عهده خبرگان منتخب مردم است. خبرگان رهبری درباره فقهای واجد شرایط بررسی و مشورت می‌کنند و رهبر منتخب خبرگان، ولایت امر و همه مسئولیت‌های ناشی از آن را بر عهده خواهد داشت. رهبر در برابر قوانین با سایر افراد کشور مساوی است."}, {"article_number": 108, "text": "قانون مربوط به تعداد و شرایط خبرگان، کیفیت انتخاب آنها و آیین‌نامه داخلی جلسات آنان برای نخستین دوره باید به‌وسیله فقهای اولین شورای نگهبان تهیه و به تصویب نهایی رهبر انقلاب برسد."}, {"article_number": 109, "text": "شرایط و صفات رهبر: ۱- صلاحیت علمی لازم برای افتاء در ابواب مختلف فقه؛ ۲- عدالت و تقوای لازم برای رهبری امت اسلام؛ ۳- بینش صحیح سیاسی و اجتماعی، تدبیر، شجاعت، مدیریت و قدرت کافی برای رهبری."}, {"article_number": 110, "text": "وظایف و اختیارات رهبر: ۱- تعیین سیاست‌های کلّی نظام؛ ۲- نظارت بر حُسن اجرای سیاست‌های کلّی نظام؛ ۳- فرمان همه‌پرسی؛ ۴- فرماندهی کل نیروهای مسلح؛ ۵- اعلان جنگ و صلح و بسیج نیروها؛ ۶- نصب و عزل و قبول استعفاء فقهای شورای نگهبان، عالی‌ترین مقام قوه قضائیه، رئیس صدا و سیما، رئیس ستاد مشترك، فرمانده کل سپاه، فرماندهان عالی نیروهای نظامی و انتظامی؛ ۷- حل اختلاف و تنظیم روابط قوای سه‌گانه؛ ۸- حل معضلات نظام از طریق مجمع تشخیص مصلحت نظام؛ ۹- امضاء حكم ریاست جمهوری پس از انتخاب مردم؛ ۱۰- عزل رئیس‌جمهور با در نظر گرفتن مصالح کشور؛ ۱۱- عفو یا تخفیف مجازات محكومین."}, {"article_number": 111, "text": "هرگاه رهبر از انجام وظایف قانونی خود ناتوان شود، یا فاقد شرایط گردد، از مقام خود برکنار خواهد شد. تشخیص این امر به عهده خبرگان است. در صورت فوت یا کناره‌گیری یا عزل رهبر، شورایی مرکب از رئیس جمهور، رئیس قوه قضائیه و یكی از فقهای شورای نگهبان، همه وظایف رهبری را به طور موقت به عهده می‌گیرد."}, {"article_number": 112, "text": "مجمع تشخیص مصلحت نظام برای تشخیص مصلحت در مواردی که مصوبه مجلس را شورای نگهبان خلاف شرع یا قانون اساسی بداند و مجلس نظر شورای نگهبان را تأمین نكند، به دستور رهبری تشكیل می‌شود."}]}, {"chapter_number": 9, "chapter_title": "قوه مجریه", "category": "قوه مجریه (دولت)", "sections": [{"section_title": "مبحث اول- ریاست جمهوری و وزرا", "articles": [{"article_number": 113, "text": "پس از مقام رهبری، رئیس جمهور عالی‌ترین مقام رسمی کشور است و مسئولیت اجرای قانون اساسی و ریاست قوه مجریه را جز در اموری که مستقیماً به رهبری مربوط می‌شود، بر عهده دارد."}, {"article_number": 114, "text": "رئیس جمهور برای مدت چهار سال با رأی مستقیم مردم انتخاب می‌شود و انتخاب مجدد او به صورت متوالی تنها برای یك دوره بلامانع است."}, {"article_number": 115, "text": "رئیس جمهور باید از میان رجال مذهبی و سیاسی که واجد شرایط زیر باشند انتخاب گردد: ایرانی‌الاصل، تابع ایران، مدیر و مدبّر، دارای حُسن سابقه و امانت و تقوی، مؤمن و معتقد به مبانی جمهوری اسلامی ایران و مذهب رسمی کشور."}, {"article_number": 116, "text": "نامزدهای ریاست جمهوری باید قبل از شروع انتخابات آمادگی خود را رسماً اعلام کنند. نحوه برگزاری انتخاب رئیس جمهوری را قانون معین می‌کند."}, {"article_number": 117, "text": "رئیس جمهور با اکثریت مطلق آراء شرکت‌کنندگان، انتخاب می‌شود، ولی هرگاه در دور نخست هیچ‌یك از نامزدها چنین اکثریتی بدست نیاورد، روز جمعه هفته بعد برای بار دوم رأی گرفته می‌شود و تنها دو نفر از نامزدها که آراء بیشتری داشته‌اند شرکت می‌کنند."}, {"article_number": 118, "text": "مسئولیت نظارت بر انتخابات ریاست جمهوری بر عهده شورای نگهبان است."}, {"article_number": 119, "text": "انتخاب رئیس جمهور جدید باید حداقل یك ماه پیش از پایان دوره ریاست جمهوری قبلی انجام شده باشد."}, {"article_number": 120, "text": "هرگاه در فاصله ده روز پیش از رأی‌گیری یكی از نامزدها فوت کند، انتخابات به مدت دو هفته به تأخیر می‌افتد."}, {"article_number": 121, "text": "رئیس جمهور در مجلس شورای اسلامی سوگند یاد می‌کند که پاسدار مذهب رسمی و نظام جمهوری اسلامی و قانون اساسی کشور باشد و خود را وقف خدمت به مردم و اعتلای کشور سازد و از هرگونه خودکامگی بپرهیزد."}, {"article_number": 122, "text": "رئیس جمهور در حدود اختیارات و وظایفی که به موجب قانون اساسی و یا قوانین عادی به عهده دارد در برابر ملت و رهبر و مجلس شورای اسلامی مسئول است."}, {"article_number": 123, "text": "رئیس جمهور موظف است مصوبات مجلس یا نتیجه همه‌پرسی را پس از طی مراحل قانونی و ابلاغ به وی امضاء کند و برای اجرا در اختیار مسئولان بگذارد."}, {"article_number": 124, "text": "رئیس جمهور می‌تواند برای انجام وظایف قانونی خود معاونانی داشته باشد. معاون اول رئیس جمهور با موافقت وی اداره هیئت وزیران و مسئولیت هماهنگی سایر معاونت‌ها را بر عهده خواهد داشت."}, {"article_number": 125, "text": "امضای عهدنامه‌ها، مقاوله‌نامه‌ها، موافقت‌نامه‌ها و قراردادهای دولت ایران با سایر دولت‌ها پس از تصویب مجلس شورای اسلامی با رئیس جمهور یا نماینده قانونی او است."}, {"article_number": 126, "text": "رئیس جمهور مسئولیت امور برنامه و بودجه و امور اداری و استخدامی کشور را مستقیماً بر عهده دارد و می‌تواند اداره آنها را به عهده دیگری بگذارد."}, {"article_number": 127, "text": "رئیس جمهور می‌تواند در موارد خاص، برحسب ضرورت با تصویب هیئت وزیران، نماینده یا نمایندگان ویژه با اختیارات مشخص تعیین نماید."}, {"article_number": 128, "text": "سفیران به پیشنهاد وزیر امور خارجه و تصویب رئیس جمهور تعیین می‌شوند. رئیس جمهور استوارنامه سفیران را امضاء می‌کند."}, {"article_number": 129, "text": "اعطای نشان‌های دولتی با رئیس جمهور است."}, {"article_number": 130, "text": "رئیس جمهور استعفای خود را به رهبر تقدیم می‌کند و تا زمانی که استعفای او پذیرفته نشده است به انجام وظایف خود ادامه می‌دهد."}, {"article_number": 131, "text": "در صورت فوت، عزل، استعفاء، غیبت یا بیماری بیش از دو ماه رئیس جمهور، معاون اول رئیس جمهور با موافقت رهبری، اختیارات و مسئولیت‌های وی را بر عهده می‌گیرد و شورایی متشكل از رئیس مجلس، رئیس قوه قضائیه و معاون اول موظف است ظرف مدت پنجاه روز رئیس جمهور جدید انتخاب شود."}, {"article_number": 132, "text": "در مدتی که اختیارات رئیس جمهور بر عهده معاون اول یا فرد دیگری است، وزرا را نمی‌توان استیضاح کرد یا به آنان رأی عدم اعتماد داد و نیز نمی‌توان برای تجدیدنظر در قانون اساسی یا همه‌پرسی اقدام نمود."}, {"article_number": 133, "text": "وزرا توسط رئیس جمهور تعیین و برای گرفتن رأی اعتماد به مجلس معرفی می‌شوند. با تغییر مجلس، گرفتن رأی اعتماد جدید برای وزرا لازم نیست."}, {"article_number": 134, "text": "ریاست هیئت وزیران با رئیس جمهور است که بر کار وزیران نظارت دارد و با همكاری وزیران، برنامه و خط مشی دولت را تعیین و قوانین را اجرا می‌کند. رئیس جمهور در برابر مجلس، مسئول اقدامات هیئت وزیران است."}, {"article_number": 135, "text": "وزرا تا زمانی که عزل نشده‌اند و یا مجلس به آنها رأی عدم اعتماد نداده است در سِمَت خود باقی می‌مانند. رئیس جمهور می‌تواند برای وزارتخانه‌هایی که وزیر ندارند حداکثر برای مدت سه ماه سرپرست تعیین نماید."}, {"article_number": 136, "text": "رئیس جمهور می‌تواند وزرا را عزل کند و در این صورت باید برای وزیر یا وزیران جدید از مجلس رأی اعتماد بگیرد."}, {"article_number": 137, "text": "هر یك از وزیران، مسئول وظایف خاص خویش در برابر رئیس جمهور و مجلس است و در اموری که به تصویب هیئت وزیران می‌رسد مسئول اعمال دیگران نیز هست."}, {"article_number": 138, "text": "هیئت وزیران حق دارد برای انجام وظایف اداری و تأمین اجرای قوانین به وضع تصویب‌نامه و آیین‌نامه بپردازد. دولت می‌تواند تصویب برخی از امور را به کمیسیون‌های متشكل از چند وزیر واگذار نماید."}, {"article_number": 139, "text": "صلح دعاوی راجع به اموال عمومی و دولتی یا ارجاع آن به داوری، موکول به تصویب هیئت وزیران است و باید به اطلاع مجلس برسد."}, {"article_number": 140, "text": "رسیدگی به اتهام رئیس جمهور و معاونان او و وزیران در مورد جرایم عادی با اطلاع مجلس شورای اسلامی در دادگاه‌های عمومی دادگستری انجام می‌شود."}, {"article_number": 141, "text": "رئیس جمهور، معاونان رئیس جمهور، وزیران و کارمندان دولت نمی‌توانند بیش از یك شغل دولتی داشته باشند."}, {"article_number": 142, "text": "دارایی رهبر، رئیس جمهور، معاونان رئیس جمهور، وزیران و همسر و فرزندان آنان قبل و بعد از خدمت، توسط رئیس قوه قضائیه رسیدگی می‌شود که بر خلاف حق افزایش نیافته باشد."}]}, {"section_title": "مبحث دوم- ارتش و سپاه پاسداران انقلاب", "articles": [{"article_number": 143, "text": "ارتش جمهوری اسلامی ایران پاسداری از استقلال و تمامیت ارضی و نظام جمهوری اسلامی کشور را بر عهده دارد."}, {"article_number": 144, "text": "ارتش جمهوری اسلامی ایران باید ارتشی اسلامی باشد که ارتشی مكتبی و مردمی است و باید افرادی شایسته را به خدمت بپذیرد."}, {"article_number": 145, "text": "هیچ فرد خارجی به عضویت در ارتش و نیروهای انتظامی کشور پذیرفته نمی‌شود."}, {"article_number": 146, "text": "استقرار هرگونه پایگاه نظامی خارجی در کشور هر چند به عنوان استفاده‌های صلح‌آمیز باشد ممنوع است."}, {"article_number": 147, "text": "دولت باید در زمان صلح از افراد و تجهیزات فنی ارتش در کارهای امدادی، آموزشی، تولیدی و جهاد سازندگی استفاده کند در حدّی که به آمادگی رزمی ارتش آسیبی وارد نیاید."}, {"article_number": 148, "text": "هر نوع بهره‌برداری شخصی از وسایل و امكانات ارتش و استفاده شخصی از افراد آنها به صورت گماشته، راننده شخصی و نظایر اینها ممنوع است."}, {"article_number": 149, "text": "ترفیع درجه نظامیان و سلب آن به موجب قانون است."}, {"article_number": 150, "text": "سپاه پاسداران انقلاب اسلامی که در نخستین روزهای پیروزی این انقلاب تشكیل شد، برای ادامه نقش خود در نگهبانی از انقلاب و دستاوردهای آن پابرجا می‌ماند."}, {"article_number": 151, "text": "دولت موظف است برای همه افراد کشور برنامه و امكانات آموزش نظامی را بر طبق موازین اسلامی فراهم نماید، ولی داشتن اسلحه باید با اجازه مقامات رسمی باشد."}]}]}, {"chapter_number": 10, "chapter_title": "سیاست خارجی", "category": "سیاست خارجی", "articles": [{"article_number": 152, "text": "سیاست خارجی جمهوری اسلامی ایران بر اساس نفی هرگونه سلطه‌جویی و سلطه‌پذیری، حفظ استقلال همه‌جانبه و تمامیت ارضی کشور، دفاع از حقوق همه مسلمانان و عدم تعهد در برابر قدرت‌های سلطه‌گر و روابط صلح‌آمیز متقابل با دول غیرمحارب استوار است."}, {"article_number": 153, "text": "هرگونه قرارداد که موجب سلطه بیگانه بر منابع طبیعی و اقتصادی، فرهنگ، ارتش و دیگر شئون کشور گردد ممنوع است."}, {"article_number": 154, "text": "جمهوری اسلامی ایران سعادت انسان در کل جامعه بشری را آرمان خود می‌داند و استقلال و آزادی و حكومت حق و عدل را حق همه مردم جهان می‌شناسد. در عین خودداری کامل از هرگونه دخالت در امور داخلی ملت‌های دیگر، از مبارزه حق‌طلبانه مستضعفین در برابر مستكبرین حمایت می‌کند."}, {"article_number": 155, "text": "دولت جمهوری اسلامی ایران می‌تواند به کسانی که پناهندگی سیاسی بخواهند پناه دهد مگر این که بر طبق قوانین ایران خائن و تبهكار شناخته شوند."}]}, {"chapter_number": 11, "chapter_title": "قوه قضائیه", "category": "قوه قضائیه (دادگستری)", "articles": [{"article_number": 156, "text": "قوه قضائیه قوه‌ای است مستقل که پشتیبان حقوق فردی و اجتماعی و مسئول تحقق بخشیدن به عدالت است و عهده‌دار وظایف زیر است: رسیدگی و صدور حكم در مورد تظلّمات و شكایات؛ احیای حقوق عامه و گسترش عدل؛ نظارت بر حُسن اجرای قوانین؛ کشف جرم و تعقیب و مجازات مجرمین؛ اقدام مناسب برای پیشگیری از وقوع جرم."}, {"article_number": 157, "text": "به منظور انجام مسئولیت‌های قوه قضائیه، مقام رهبری یك نفر مجتهد عادل و آگاه به امور قضایی را برای مدت پنج سال به عنوان رئیس قوه قضائیه تعیین می‌نماید که عالی‌ترین مقام قوه قضائیه است."}, {"article_number": 158, "text": "وظایف رئیس قوه قضائیه: ۱- ایجاد تشكیلات لازم در دادگستری؛ ۲- تهیه لوایح قضایی متناسب با جمهوری اسلامی؛ ۳- استخدام قضات عادل و شایسته و عزل و نصب آنها و تغییر محل مأموریت و تعیین مشاغل و ترفیع آنان."}, {"article_number": 159, "text": "مرجع رسمی تظلّمات و شكایات، دادگستری است. تشكیل دادگاه‌ها و تعیین صلاحیت آنها منوط به حكم قانون است."}, {"article_number": 160, "text": "وزیر دادگستری مسئولیت کلیه مسائل مربوطه به روابط قوه قضائیه با قوه مجریه و قوه مقننه را بر عهده دارد و از میان کسانی که رئیس قوه قضائیه پیشنهاد می‌کند انتخاب می‌گردد."}, {"article_number": 161, "text": "دیوان عالی کشور به منظور نظارت بر اجرای صحیح قوانین در محاکم و ایجاد وحدت رویه قضایی و انجام مسئولیت‌هایی که طبق قانون به آن محول می‌شود تشكیل می‌گردد."}, {"article_number": 162, "text": "رئیس دیوان عالی کشور و دادستان کل باید مجتهد عادل و آگاه به امور قضایی باشند و رئیس قوه قضائیه آنها را برای مدت پنج سال منصوب می‌کند."}, {"article_number": 163, "text": "صفات و شرایط قاضی طبق موازین فقهی به وسیله قانون معین می‌شود."}, {"article_number": 164, "text": "قاضی را نمی‌توان از مقامی که شاغل آن است بدون محاکمه و ثبوت جرم یا تخلفی که موجب انفصال است به طور موقت یا دائم منفصل کرد یا بدون رضای او محل خدمت یا سِمَتش را تغییر داد."}, {"article_number": 165, "text": "محاکمات، علنی انجام می‌شود و حضور افراد بلامانع است مگر آنكه به تشخیص دادگاه، علنی بودن آن منافی عفت عمومی یا نظم عمومی باشد."}, {"article_number": 166, "text": "احكام دادگاه‌ها باید مستدلّ و مستند به مواد قانون و اصولی باشد که بر اساس آن حكم صادر شده است."}, {"article_number": 167, "text": "قاضی موظف است کوشش کند حكم هر دعوا را در قوانین مدوّنه بیابد و اگر نیابد با استناد به منابع معتبر اسلامی یا فتاوی معتبر، حكم قضیه را صادر نماید و نمی‌تواند از رسیدگی به دعوا امتناع ورزد."}, {"article_number": 168, "text": "رسیدگی به جرایم سیاسی و مطبوعاتی علنی است و با حضور هیئت منصفه در محاکم دادگستری صورت می‌گیرد."}, {"article_number": 169, "text": "هیچ فعلی یا ترك فعلی به استناد قانونی که بعد از آن وضع شده است جرم محسوب نمی‌شود."}, {"article_number": 170, "text": "قضات دادگاه‌ها مكلفند از اجرای تصویب‌نامه‌ها و آیین‌نامه‌های دولتی که مخالف با قوانین و مقررات اسلامی یا خارج از حدود اختیارات قوه مجریه است خودداری کنند."}, {"article_number": 171, "text": "هرگاه در اثر تقصیر یا اشتباه قاضی ضرر مادی یا معنوی متوجه کسی گردد، در صورت تقصیر، مقصر ضامن است و در غیر این صورت خسارت به‌وسیله دولت جبران می‌شود."}, {"article_number": 172, "text": "برای رسیدگی به جرایم مربوط به وظایف خاص نظامی یا انتظامی اعضای ارتش، محاکم نظامی مطابق قانون تشكیل می‌گردد."}, {"article_number": 173, "text": "به منظور رسیدگی به شكایات، تظلّمات و اعتراضات مردم نسبت به مأمورین یا واحدها یا آیین‌نامه‌های دولتی، دیوانی به نام «دیوان عدالت اداری» زیر نظر رئیس قوه قضائیه تأسیس می‌گردد."}, {"article_number": 174, "text": "بر اساس حق نظارت قوه قضائیه نسبت به حُسن جریان امور در دستگاه‌های اداری، سازمانی به نام «سازمان بازرسی کل کشور» زیر نظر رئیس قوه قضائیه تشكیل می‌گردد."}]}, {"chapter_number": 12, "chapter_title": "صدا و سیما", "category": "رسانه ملی", "articles": [{"article_number": 175, "text": "در صدا و سیمای جمهوری اسلامی ایران، آزادی بیان و نشر افكار با رعایت موازین اسلامی و مصالح کشور باید تأمین گردد. نصب و عزل رئیس سازمان صدا و سیما با مقام رهبری است و شورایی مرکب از نمایندگان رئیس جمهور، رئیس قوه قضائیه و مجلس شورای اسلامی نظارت بر این سازمان خواهند داشت."}]}, {"chapter_number": 13, "chapter_title": "شورای عالی امنیت ملی", "category": "امنیت ملی", "articles": [{"article_number": 176, "text": "به منظور تأمین منافع ملی و پاسداری از انقلاب اسلامی و تمامیت ارضی و حاکمیت ملی، «شورای عالی امنیت ملی» به ریاست رئیس جمهور تشكیل می‌گردد با وظایف: ۱- تعیین سیاست‌های دفاعی-امنیتی کشور؛ ۲- هماهنگ نمودن فعالیت‌های سیاسی، اطلاعاتی، اجتماعی، فرهنگی و اقتصادی در ارتباط با تدابیر کلّی دفاعی-امنیتی؛ ۳- بهره‌گیری از امكانات مادی و معنوی کشور برای مقابله با تهدیدهای داخلی و خارجی. اعضای شورا شامل رؤسای قوای سه‌گانه، رئیس ستاد فرماندهی کل نیروهای مسلح، مسئول امور برنامه و بودجه، دو نماینده مقام رهبری، وزرای امور خارجه، کشور و اطلاعات می‌باشند. مصوبات این شورا پس از تأیید مقام رهبری قابل اجرا است."}]}, {"chapter_number": 14, "chapter_title": "بازنگری در قانون اساسی", "category": "بازنگری قانون اساسی", "articles": [{"article_number": 177, "text": "بازنگری در قانون اساسی جمهوری اسلامی ایران، در موارد ضروری به ترتیب زیر انجام می‌گیرد: مقام رهبری پس از مشورت با مجمع تشخیص مصلحت نظام طی حكمی خطاب به رئیس جمهور موارد اصلاح یا تتمیم قانون اساسی را به شورای بازنگری قانون اساسی پیشنهاد می‌نماید. این شورا مرکب است از: اعضای شورای نگهبان، رؤسای قوای سه‌گانه، اعضای ثابت مجمع تشخیص مصلحت نظام، پنج نفر از اعضای مجلس خبرگان رهبری، ده نفر به انتخاب مقام رهبری، سه نفر از هیئت وزیران، سه نفر از قوه قضائیه، ده نفر از نمایندگان مجلس شورای اسلامی و سه نفر از دانشگاهیان. مصوبات شورا پس از تأیید و امضای مقام رهبری باید از طریق مراجعه به آراء عمومی به تصویب اکثریت مطلق شرکت‌کنندگان در همه‌پرسی برسد. محتوای اصول مربوط به اسلامی بودن نظام، ابتنای قوانین بر موازین اسلامی، اهداف جمهوری اسلامی ایران، جمهوری بودن حكومت، ولایت امر و امامت امت و نیز اداره امور کشور با اتكاء به آراء عمومی و دین و مذهب رسمی ایران تغییرناپذیر است."}]}]}
;

let state = { screen:'home', chapterIndex:null, articleIndex:null, query:'' };

const toFa = n => String(n).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);

function render(){
  document.getElementById('homeView').classList.toggle('hidden', state.screen!=='home');
  document.getElementById('chapterView').classList.toggle('hidden', state.screen!=='chapter');
  document.getElementById('articleView').classList.toggle('hidden', state.screen!=='article');
  document.getElementById('searchView').classList.toggle('hidden', state.screen!=='search');
  document.getElementById('backBtn').classList.toggle('hidden', state.screen==='home');

  if(state.screen==='home') renderHome();
  if(state.screen==='chapter') renderChapter();
  if(state.screen==='article') renderArticle();
  if(state.screen==='search') renderSearch();
  window.scrollTo(0,0);
}

function renderHome(){
  document.getElementById('topTitle').textContent = 'قانون اساسی جمهوری اسلامی ایران';
  document.getElementById('topSub').textContent = toFa(DATA.total_chapters) + ' فصل · ' + toFa(DATA.total_articles) + ' اصل';
  const el = document.getElementById('homeView');
  let html = '<div class="hero-line"><span class="stat">فهرست فصل‌ها</span></div>';
  DATA.chapters.forEach((ch, i) => {
    const count = allArticles(ch).length;
    html += `<div class="chapter-card" onclick="openChapter(${i})">
      <div class="seal"><span>${toFa(ch.chapter_number)}</span></div>
      <div class="chapter-info">
        <div class="cat">${ch.category}</div>
        <div class="title">${ch.chapter_title}</div>
        <div class="count">${toFa(count)} اصل</div>
      </div>
      <div class="chevron">‹</div>
    </div>`;
  });
  el.innerHTML = html;
}

function allArticles(ch){
  if(ch.articles) return ch.articles.map(a => ({...a, sectionTitle:null}));
  if(ch.sections) return ch.sections.flatMap(s => s.articles.map(a => ({...a, sectionTitle:s.section_title})));
  return [];
}

function openChapter(i){
  state = {...state, screen:'chapter', chapterIndex:i};
  render();
}

function renderChapter(){
  const ch = DATA.chapters[state.chapterIndex];
  document.getElementById('topTitle').textContent = ch.chapter_title;
  document.getElementById('topSub').textContent = 'فصل ' + toFa(ch.chapter_number) + ' · ' + ch.category;
  const el = document.getElementById('chapterView');
  let html = '';
  let lastSection = undefined;
  const arts = allArticles(ch);
  arts.forEach((a) => {
    if(a.sectionTitle !== lastSection){
      html += `<div class="section-label">${a.sectionTitle}</div>`;
      lastSection = a.sectionTitle;
    }
    html += `<div class="article-row" onclick="openArticle(${a.article_number})">
      <div class="article-badge">${toFa(a.article_number)}</div>
      <div class="article-preview">
        <div class="a-title">اصل ${toFa(a.article_number)}</div>
        <div class="a-snippet">${a.text}</div>
      </div>
    </div>`;
  });
  el.innerHTML = html;
}

function flatAll(){
  return DATA.chapters.flatMap(ch => allArticles(ch).map(a => ({...a, chapter:ch})));
}

function openArticle(articleNumber){
  const flat = flatAll();
  const idx = flat.findIndex(a => a.article_number === articleNumber);
  state = {...state, screen:'article', articleIndex: idx};
  render();
}

function renderArticle(){
  const flat = flatAll();
  const a = flat[state.articleIndex];
  const ch = a.chapter;
  document.getElementById('topTitle').textContent = 'اصل ' + toFa(a.article_number);
  document.getElementById('topSub').textContent = ch.chapter_title;
  const el = document.getElementById('articleView');

  const prev = flat[state.articleIndex-1];
  const next = flat[state.articleIndex+1];

  el.innerHTML = `
    <div class="detail-card">
      <div class="detail-seal">
        <div class="seal"><span>${toFa(a.article_number)}</span></div>
        <div class="detail-meta">
          <div class="m-chapter">${ch.category}</div>
          <div class="m-title">${ch.chapter_title}${a.sectionTitle? ' · '+a.sectionTitle : ''}</div>
        </div>
      </div>
      <div class="detail-text">${a.text}</div>
    </div>
    <div class="nav-buttons">
      <div class="nav-btn ${prev? '' : 'disabled'}" onclick="${prev? 'jumpTo('+state.articleIndex+'-1)': ''}">‹ اصل قبل</div>
      <div class="nav-btn ${next? '' : 'disabled'}" onclick="${next? 'jumpTo('+state.articleIndex+'+1)': ''}">اصل بعد ›</div>
    </div>
  `;
}

function jumpTo(expr){
  state.articleIndex = eval(expr);
  render();
}

function onSearch(q){
  state.query = q;
  if(q.trim().length === 0){
    if(state.screen === 'search') { state.screen = 'home'; render(); }
    return;
  }
  state.screen = 'search';
  render();
}

function renderSearch(){
  document.getElementById('topTitle').textContent = 'نتایج جستجو';
  document.getElementById('topSub').textContent = 'برای «' + state.query + '»';
  const el = document.getElementById('searchView');
  const q = state.query.trim();
  const flat = flatAll();
  const results = flat.filter(a => a.text.includes(q));

  if(results.length === 0){
    el.innerHTML = `<div class="empty-state"><div class="e-icon">⌕</div><div class="e-text">نتیجه‌ای یافت نشد</div></div>`;
    return;
  }

  let html = `<div class="hero-line"><span class="stat"><b>${toFa(results.length)}</b> نتیجه یافت شد</span></div>`;
  results.forEach(a => {
    const idx = flat.indexOf(a);
    const highlighted = a.text.split(q).join('<mark>'+q+'</mark>');
    html += `<div class="search-result" onclick="jumpToDirect(${idx})">
      <div class="sr-chapter">${a.chapter.chapter_title}</div>
      <div class="sr-num">اصل ${toFa(a.article_number)}</div>
      <div class="sr-text">${highlighted}</div>
    </div>`;
  });
  el.innerHTML = html;
}

function jumpToDirect(idx){
  document.getElementById('searchInput').value = '';
  state = {...state, screen:'article', articleIndex: idx};
  render();
}

function goBack(){
  if(state.screen === 'article'){
    state.screen = 'chapter';
  } else {
    state.screen = 'home';
    document.getElementById('searchInput').value='';
  }
  render();
}

render();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
